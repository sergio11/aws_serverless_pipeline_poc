[project]
name = "aws-local-poc-e2e"
version = "0.1.0"
description = "End-to-end tests for the AWS local cloud lab POC."
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.74",
    "botocore==1.43.74",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "python-ulid==3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
