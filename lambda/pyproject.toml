[project]
name = "aws-local-poc-worker"
version = "0.1.0"
description = "Lambda-style document worker for the AWS local cloud lab POC."
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.55",
    "botocore==1.43.72",
    "s3transfer==0.19.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
