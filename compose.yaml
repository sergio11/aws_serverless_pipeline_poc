name: aws-local-poc

services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:1.7.0}
    container_name: poc-floci
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4566:4566"
    environment:
      FLOCI_PORT: "4566"
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_BASE_URL: http://localhost:4566
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_LAMBDA_ENABLED: "true"
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: "poc-network"
      FLOCI_SERVICES_LAMBDA_DOCKER_HOST_OVERRIDE: "floci"
      FLOCI_SERVICES_LAMBDA_DEFAULT_TIMEOUT_SECONDS: "30"
      FLOCI_SERVICES_LAMBDA_DEFAULT_MEMORY_MB: "128"
      # podman-compose on Windows translates Unix paths (/run/user/...) to /mnt/c/...
      # so socket volume mounts don't work. Instead, the Rakefile starts
      # `podman system service --time=0 tcp:0.0.0.0:2376` inside the Podman machine
      # and Floci connects to the Docker-compatible API over TCP.
      FLOCI_DOCKER_DOCKER_HOST: "tcp://host.containers.internal:2376"
    volumes:
      - ./data/floci:/app/data
    networks:
      - poc-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  floci-ui:
    image: ${FLOCI_UI_IMAGE:-floci/floci-ui:latest}
    container_name: poc-floci-ui
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

  terraform:
    image: aws-local-poc_terraform
    build:
      context: ./terraform/container
      dockerfile: Containerfile
    container_name: poc-terraform
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    working_dir: /terraform
    volumes:
      - terraform-workdir:/terraform
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
    entrypoint: ["terraform"]
    networks:
      - poc-network

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: poc-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-poc-local-documents}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents-metadata}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

  # Document reconciler worker. Recovers orphaned documents stuck in
  # CREATED or PROCESSING state. Runs reconciliation every 5 minutes.
  reconciler-worker:
    build:
      context: ./lambda
      dockerfile: Containerfile
    container_name: poc-reconciler-worker
    command: ["python", "reconciler.py", "--poll"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents-metadata}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
      RECONCILER_MAX_AGE_MINUTES: ${RECONCILER_MAX_AGE_MINUTES:-10}
      RECONCILER_POLL_INTERVAL_SECONDS: ${RECONCILER_POLL_INTERVAL_SECONDS:-300}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

networks:
  poc-network:
    name: poc-network

volumes:
  terraform-workdir:
