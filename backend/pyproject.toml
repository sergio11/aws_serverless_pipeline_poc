[project]
name = "aws-local-poc-backend"
version = "0.1.0"
description = "FastAPI backend for the AWS local cloud lab POC."
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.74",
    "botocore==1.43.74",
    "fastapi==0.139.2",
    "pydantic==2.13.3",
    "python-ulid==3.0.0",
    "uvicorn==0.44.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest-cov==6.1.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 98
show_missing = true
