name: aws-local-poc

services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:1.5.11}
    container_name: poc-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_PORT: "4566"
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_BASE_URL: http://localhost:4566
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - ./data/floci:/app/data
    networks:
      - poc-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: poc-backend
    ports:
      - "8000:8000"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: ${S3_BUCKET:-poc-local-documents}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
    depends_on:
      - floci
    networks:
      - poc-network

  lambda-worker:
    build:
      context: ./lambda
      dockerfile: Containerfile
    container_name: poc-lambda-worker
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      - floci
    networks:
      - poc-network

networks:
  poc-network:
    name: poc-network
