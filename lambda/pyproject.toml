[project]
name = "aws-local-poc-worker"
version = "0.1.0"
description = "Lambda-style document worker for the AWS local cloud lab POC."
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.74",
    "botocore==1.43.74",
]

[project.optional-dependencies]
test = [
    "pytest-cov==6.1.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["handler"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 98
show_missing = true
