name: aws-local-poc

services:
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:1.5.11}
    container_name: poc-floci
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4566:4566"
    environment:
      FLOCI_PORT: "4566"
      FLOCI_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_BASE_URL: http://localhost:4566
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_LAMBDA_ENABLED: "true"
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: "poc-network"
      FLOCI_SERVICES_LAMBDA_DEFAULT_TIMEOUT_SECONDS: "30"
      FLOCI_SERVICES_LAMBDA_DEFAULT_MEMORY_MB: "128"
    volumes:
      - ./data/floci:/app/data
      # SECURITY: Docker socket is REQUIRED for Floci Lambda simulation via Docker-in-Docker.
      # This grants FULL control of the host Docker daemon to the container.
      # NEVER use in production. For real AWS Lambda emulation, use Floci's native
      # Lambda support without Docker socket or use rootless Podman socket with TLS.
      #
      # To disable Lambda simulation (recommended for security), set:
      #   FLOCI_SERVICES_LAMBDA_ENABLED: "false"
      # and remove the docker.sock volume mount below.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - poc-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  floci-ui:
    image: ${FLOCI_UI_IMAGE:-floci/floci-ui:1.5.11}
    container_name: poc-floci-ui
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

  terraform:
    build:
      context: ./terraform/container
      dockerfile: Containerfile
    container_name: poc-terraform
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    working_dir: /terraform
    volumes:
      - terraform-workdir:/terraform
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
    entrypoint: ["terraform"]
    networks:
      - poc-network

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: poc-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-poc-local-documents}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents-metadata}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

  # Polling worker fallback. Used when Floci Lambda is unavailable.
  # Primary processing now uses Terraform-managed Lambda function.
  # WARNING: Do NOT start both this worker and the Terraform Lambda simultaneously.
  # They consume the same SQS queue and would create a race condition.
  lambda-worker:
    build:
      context: ./lambda
      dockerfile: Containerfile
    container_name: poc-lambda-worker
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents-metadata}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

  integration:
    build:
      context: ./tests/integration
      dockerfile: Containerfile
    container_name: poc-integration
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-poc-local-documents}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents-metadata}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-document-events-dlq}
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - poc-network

  e2e:
    build:
      context: ./tests/e2e
      dockerfile: Containerfile
    container_name: poc-e2e
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_ENDPOINT: http://backend:8000
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-poc-local-documents}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-documents-metadata}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-document-events}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-document-events-dlq}
    depends_on:
      backend:
        condition: service_healthy
      # NOTE: E2E tests use the Terraform-managed Lambda function via Floci,
      # not the polling worker. Do NOT add lambda-worker here.
      # The Terraform Lambda is provisioned by `rake infra:deploy` before tests run.
    networks:
      - poc-network

networks:
  poc-network:
    name: poc-network

volumes:
  terraform-workdir:
